[package]
name = "auditant"
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
description = "Planned. The crate name is reserved; there is no API yet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/auditant"
readme = "README.md"
publish = false

[dependencies]
blake3 = "1.8.7"
persistant = { version = "0.18.30", features = ["registry-sqlite"] }
erased-serde = "0.4.11"
redactant = { version = "0.1.14", features = ["derive", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4.1"
ed25519-dalek = "3.0.0"

[features]
# Server backends for `SqliteTrail::open_backend` (tests/backends.rs; CI runs them against service containers).
postgres = ["persistant/registry-postgres"]
mysql = ["persistant/registry-mysql"]

[dev-dependencies]
tempfile = "3.27.0"
