[package]
name = "auditant"
version = "0.0.3"
edition = "2024"
rust-version = "1.94"
description = "Planned. The crate name is reserved; there is no API yet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/auditant"
readme = "README.md"
publish = false

[dependencies]
blake3 = "1.8.7"
persistant = { version = "0.18.28", features = ["registry-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4.1"
# TEMPORARY pin (auditant finding 2026-11-19, confirmed by persistant at 2290e4d): persistant 0.18.28's matrix is keyed to bundled SQLite 3.51.3 (libsqlite3-sys 0.37.0);
# 0.40.0 bundles 3.54.1 and every lookup is "unverified(no row)". Remove this pin when the persistant fix release is out.
libsqlite3-sys = "=0.37.0"

[dev-dependencies]
tempfile = "3.27.0"
